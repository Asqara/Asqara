<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Color tokens (light)">
<title>Color tokens (light)</title>
<style>
.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace}.s{font-family:Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif}
.t{fill:#101010}.mu{fill:#595959}.v{fill:#8155ff}.a{fill:#5f7f00}.ol{fill:#101010}
.fb{transform-box:fill-box;transform-origin:center}
.r{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.f{animation:fade 1.2s ease both}
.blink{animation:blink 1.05s steps(1) infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.flow{stroke-dasharray:3 7;animation:flow .9s linear infinite}
.draw{stroke-dasharray:1;animation:draw 1.6s cubic-bezier(.16,1,.3,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.6s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<rect width="1000" height="250" fill="#f4f3ef"/>
<text x="24" y="36" class="m v" font-size="13" letter-spacing="1.5">/ DS-01  <tspan class="mu">COLOR TOKENS — LIGHT</tspan></text>
<g class="r" style="animation-delay:0.00s"><rect x="24.0" y="58" width="126" height="110" fill="#f4f3ef" stroke="#d4d2cc"/><text x="24.0" y="194" class="m t" font-size="12" font-weight="700">--bg</text><text x="24.0" y="214" class="m mu" font-size="11">#f4f3ef</text><text x="24.0" y="232" class="s mu" font-size="12">Background</text></g>
<g class="r" style="animation-delay:0.07s"><rect x="160.0" y="58" width="126" height="110" fill="#faf9f6" stroke="#d4d2cc"/><text x="160.0" y="194" class="m t" font-size="12" font-weight="700">--surface</text><text x="160.0" y="214" class="m mu" font-size="11">#faf9f6</text><text x="160.0" y="232" class="s mu" font-size="12">Surface</text></g>
<g class="r" style="animation-delay:0.14s"><rect x="296.0" y="58" width="126" height="110" fill="#d4d2cc" stroke="#d4d2cc"/><text x="296.0" y="194" class="m t" font-size="12" font-weight="700">--border</text><text x="296.0" y="214" class="m mu" font-size="11">#d4d2cc</text><text x="296.0" y="232" class="s mu" font-size="12">Border</text></g>
<g class="r" style="animation-delay:0.21s"><rect x="432.0" y="58" width="126" height="110" fill="#101010" stroke="#d4d2cc"/><text x="432.0" y="194" class="m t" font-size="12" font-weight="700">--text</text><text x="432.0" y="214" class="m mu" font-size="11">#101010</text><text x="432.0" y="232" class="s mu" font-size="12">Text</text></g>
<g class="r" style="animation-delay:0.28s"><rect x="568.0" y="58" width="126" height="110" fill="#595959" stroke="#d4d2cc"/><text x="568.0" y="194" class="m t" font-size="12" font-weight="700">--muted</text><text x="568.0" y="214" class="m mu" font-size="11">#595959</text><text x="568.0" y="232" class="s mu" font-size="12">Muted</text></g>
<g class="r" style="animation-delay:0.35s"><rect x="704.0" y="58" width="126" height="110" fill="#8155ff" stroke="#d4d2cc"/><text x="704.0" y="194" class="m t" font-size="12" font-weight="700">--violet</text><text x="704.0" y="214" class="m mu" font-size="11">#8155ff</text><text x="704.0" y="232" class="s mu" font-size="12">Violet / primary</text></g>
<g class="r" style="animation-delay:0.42s"><rect x="840.0" y="58" width="126" height="110" fill="#d7ff3f" stroke="#d4d2cc"/><text x="840.0" y="194" class="m t" font-size="12" font-weight="700">--lime</text><text x="840.0" y="214" class="m mu" font-size="11">#d7ff3f</text><text x="840.0" y="232" class="s mu" font-size="12">Lime / signal</text></g>
</svg>
