<g class="r" style="animation-delay:0.45s"><text x="774.0" y="34" class="m mu" font-size="11" letter-spacing="2">0 4</text><text x="774.0" y="92" class="s t" font-size="44" font-weight="800" letter-spacing="-1.5">~60%</text><text x="774.0" y="120" class="m t" font-size="11" letter-spacing="1.5">FASTER PAGE LOAD</text><text x="774.0" y="138" class="s mu" font-size="13">Next.js optimization</text></g>
<path transform="translate(850.0,22)" d="M0,26 L18,22 L36,24 L54,14 L72,18 L90,8 L108,12 L126,2" fill="none" stroke="#8155ff" stroke-width="1.6" pathLength="1" class="draw" style="animation-delay:0.85s"/>
<circle cx="976.0" cy="24" r="3" class="a"/><circle cx="976.0" cy="24" r="3" class="a pulse" style="animation-delay:0.45s"/>
