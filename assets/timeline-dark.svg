<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="398" viewBox="0 0 1000 398" role="img" aria-label="Experience timeline">
<title>Experience timeline</title>
<style>
.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace}.s{font-family:Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif}
.t{fill:#f2f1ec}.mu{fill:#a8a8a2}.v{fill:#9875ff}.a{fill:#d7ff3f}.ol{fill:#101010}
.fb{transform-box:fill-box;transform-origin:center}
.r{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.f{animation:fade 1.2s ease both}
.blink{animation:blink 1.05s steps(1) infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.flow{stroke-dasharray:3 7;animation:flow .9s linear infinite}
.draw{stroke-dasharray:1;animation:draw 1.6s cubic-bezier(.16,1,.3,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.6s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<rect width="1000" height="398" fill="#0c0d0f"/>
<text x="64" y="26" class="m mu" font-size="11" letter-spacing="2">YEAR</text>
<text x="290" y="26" class="m mu" font-size="11" letter-spacing="2">ROLE</text>
<text x="660" y="26" class="m mu" font-size="11" letter-spacing="2">ORGANIZATION</text>
<line x1="0" y1="40" x2="1000" y2="40" stroke="#292b30"/>
<line x1="28" y1="56" x2="28" y2="374" stroke="#292b30" stroke-width="2"/>
<line x1="28" y1="56" x2="28" y2="374" stroke="#9875ff" stroke-width="2" pathLength="1" class="draw"/>
<g class="r" style="animation-delay:0.00s"><text x="64" y="83" class="m a" font-size="12" letter-spacing="1.5">2025 — PRESENT</text><text x="290" y="84" class="s t" font-size="18" font-weight="700">Information Systems Coordinator</text><text x="660" y="83" class="s mu" font-size="15">OMB IPB 63 × Agrisymphony 2026</text></g>
<line x1="64" y1="112" x2="1000" y2="112" stroke="#292b30" stroke-dasharray="2 4"/>
<circle cx="28" cy="78" r="6" class="a"/><circle cx="28" cy="78" r="6" class="a pulse" style="animation-delay:0.00s"/>
<g class="r" style="animation-delay:0.15s"><text x="64" y="149" class="m a" font-size="12" letter-spacing="1.5">2025 — PRESENT</text><text x="290" y="150" class="s t" font-size="18" font-weight="700">Web Developer</text><text x="660" y="149" class="s mu" font-size="15">Code Panda</text></g>
<line x1="64" y1="178" x2="1000" y2="178" stroke="#292b30" stroke-dasharray="2 4"/>
<circle cx="28" cy="144" r="6" class="a"/><circle cx="28" cy="144" r="6" class="a pulse" style="animation-delay:0.60s"/>
<g class="r" style="animation-delay:0.30s"><text x="64" y="215" class="m t" font-size="12" letter-spacing="1.5">2025</text><text x="290" y="216" class="s t" font-size="18" font-weight="700">Web Developer</text><text x="660" y="215" class="s mu" font-size="15">Agrisymphony</text></g>
<line x1="64" y1="244" x2="1000" y2="244" stroke="#292b30" stroke-dasharray="2 4"/>
<circle cx="28" cy="210" r="5" fill="#0c0d0f" stroke="#9875ff" stroke-width="2"/>
<g class="r" style="animation-delay:0.45s"><text x="64" y="281" class="m t" font-size="12" letter-spacing="1.5">2025</text><text x="290" y="282" class="s t" font-size="18" font-weight="700">Head of Research &amp; Development</text><text x="660" y="281" class="s mu" font-size="15">Ormawa Eksekutif PKU IPB</text></g>
<line x1="64" y1="310" x2="1000" y2="310" stroke="#292b30" stroke-dasharray="2 4"/>
<circle cx="28" cy="276" r="5" fill="#0c0d0f" stroke="#9875ff" stroke-width="2"/>
<g class="r" style="animation-delay:0.60s"><text x="64" y="347" class="m t" font-size="12" letter-spacing="1.5">2024</text><text x="290" y="348" class="s t" font-size="18" font-weight="700">Data Operations</text><text x="660" y="347" class="s mu" font-size="15">Balai Penyuluhan Pertanian Bekri</text></g>
<line x1="64" y1="376" x2="1000" y2="376" stroke="#292b30" stroke-dasharray="2 4"/>
<circle cx="28" cy="342" r="5" fill="#0c0d0f" stroke="#9875ff" stroke-width="2"/>
</svg>
