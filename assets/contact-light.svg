<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Contact — Let's build something useful">
<title>Contact — Let's build something useful</title>
<style>
.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace}.s{font-family:Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif}
.t{fill:#101010}.mu{fill:#595959}.v{fill:#8155ff}.a{fill:#5f7f00}.ol{fill:#101010}
.fb{transform-box:fill-box;transform-origin:center}
.r{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.f{animation:fade 1.2s ease both}
.blink{animation:blink 1.05s steps(1) infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.flow{stroke-dasharray:3 7;animation:flow .9s linear infinite}
.draw{stroke-dasharray:1;animation:draw 1.6s cubic-bezier(.16,1,.3,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.6s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.mer{transform-box:view-box;transform-origin:820px 160px;animation:mer 6s linear infinite}
@keyframes mer{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}

</style>
<rect width="1000" height="360" fill="#f4f3ef"/>
<defs><pattern id="gc" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e6e4de" stroke-width="1"/></pattern></defs><rect width="1000" height="360" fill="url(#gc)"/>
<text x="24" y="44" class="m v r" font-size="13" letter-spacing="1.5">/ 14  <tspan class="mu">CONTACT / OPEN CHANNEL</tspan></text>
<g class="r" style="animation-delay:0.15s"><text x="20" y="124" class="s t" font-size="64" font-weight="800" letter-spacing="-2.5" textLength="370" lengthAdjust="spacingAndGlyphs">LET'S BUILD</text></g>
<g class="r" style="animation-delay:0.30s"><text x="20" y="194" class="s t" font-size="64" font-weight="800" letter-spacing="-2.5" textLength="580" lengthAdjust="spacingAndGlyphs">SOMETHING USEFUL<tspan class="a">.</tspan></text></g>
<g class="r" style="animation-delay:0.45s"><text x="24" y="236" class="s mu" font-size="16">Open to software engineering opportunities, technical collaboration</text><text x="24" y="260" class="s mu" font-size="16">and building ambitious systems.</text></g>
<circle cx="820" cy="160" r="108" fill="#faf9f6" stroke="#101010" stroke-width="1.2"/>
<ellipse cx="820" cy="160" rx="108" ry="19" fill="none" stroke="#d4d2cc"/>
<ellipse cx="820" cy="160" rx="108" ry="38" fill="none" stroke="#d4d2cc"/>
<line x1="712" y1="160" x2="928" y2="160" stroke="#d4d2cc"/>
<g class="mer" style="animation-delay:-0.0s"><ellipse cx="820" cy="160" rx="27" ry="108" fill="none" stroke="#8155ff" stroke-width="1" opacity=".8"/></g>
<g class="mer" style="animation-delay:-1.2s"><ellipse cx="820" cy="160" rx="59" ry="108" fill="none" stroke="#8155ff" stroke-width="1" opacity=".8"/></g>
<g class="mer" style="animation-delay:-2.4s"><ellipse cx="820" cy="160" rx="92" ry="108" fill="none" stroke="#8155ff" stroke-width="1" opacity=".8"/></g>
<circle cx="846" cy="178" r="5" class="a"/><circle cx="846" cy="178" r="5" class="a pulse"/><line x1="846" y1="178" x2="926" y2="248" stroke="#5f7f00"/><text x="932" y="252" class="m t" font-size="11" letter-spacing="1.5">BOGOR</text>
<text x="976" y="298" text-anchor="end" class="m mu f" font-size="11" letter-spacing="1.5" style="animation-delay:0.60s">GLOBAL NODE · 06.5971° S 106.8060° E · UTC+7</text>
<line x1="0" y1="310" x2="1000" y2="310" stroke="#d4d2cc"/>
<text x="24" y="340" class="m mu" font-size="11" letter-spacing="1.5">© 2026 ASQARA.TECH — SYSTEMS BUILT FOR REAL USE.</text>
<text x="976" y="340" text-anchor="end" class="m t" font-size="11" letter-spacing="1.5">START A CONVERSATION <tspan class="a">↗</tspan></text>
</svg>
