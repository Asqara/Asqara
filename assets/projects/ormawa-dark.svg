<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="Ormawa Eksekutif PKU — ORGANIZATION PLATFORM">
<title>Ormawa Eksekutif PKU — ORGANIZATION PLATFORM</title>
<style>
.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace}.s{font-family:Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif}
.t{fill:#f2f1ec}.mu{fill:#a8a8a2}.v{fill:#9875ff}.a{fill:#d7ff3f}.ol{fill:#101010}
.fb{transform-box:fill-box;transform-origin:center}
.r{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.f{animation:fade 1.2s ease both}
.blink{animation:blink 1.05s steps(1) infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.flow{stroke-dasharray:3 7;animation:flow .9s linear infinite}
.draw{stroke-dasharray:1;animation:draw 1.6s cubic-bezier(.16,1,.3,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.6s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.sweep{animation:sweep 5s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-120px)}60%,100%{transform:translateX(520px)}}
.arrow{animation:arrow 1.8s cubic-bezier(.16,1,.3,1) infinite}
@keyframes arrow{0%,40%{transform:none}70%{transform:translate(5px,-5px)}100%{transform:none}}

</style>
<rect width="480" height="300" fill="#0c0d0f"/>
<defs><linearGradient id="sw2" x1="0" x2="1"><stop offset="0" stop-color="#9875ff" stop-opacity="0"/><stop offset=".5" stop-color="#9875ff" stop-opacity=".14"/><stop offset="1" stop-color="#9875ff" stop-opacity="0"/></linearGradient><clipPath id="cp2"><rect width="480" height="300"/></clipPath></defs>
<rect x=".5" y=".5" width="479" height="299" fill="#121317" stroke="#292b30"/>
<g clip-path="url(#cp2)"><rect class="sweep" x="0" y="0" width="120" height="300" fill="url(#sw2)"/></g>
<g class="r"><text x="24" y="40" class="m v" font-size="13" letter-spacing="2">0 3</text><text x="456" y="40" text-anchor="end" class="m mu" font-size="11" letter-spacing="1.2">ORGANIZATION PLATFORM · 2024—2025</text></g>
<line x1="24" y1="56" x2="456" y2="56" stroke="#292b30"/>
<g class="r" style="animation-delay:0.10s"><text x="22" y="104" class="s t" font-size="26" font-weight="800" letter-spacing="-.8">Ormawa Eksekutif PKU</text></g>
<g class="arrow"><text x="456" y="104" text-anchor="end" class="s a" font-size="26" font-weight="700">↗</text></g>
<g class="r" style="animation-delay:0.20s"><text x="24" y="138" class="s mu" font-size="14.5"><tspan x="24" dy="0">Public information and publication platform for one</tspan><tspan x="24" dy="21">of the largest student organizations at PKU IPB.</tspan></text></g>
<g class="r" style="animation-delay:0.30s"><rect x="24" y="222" width="65" height="24" fill="none" stroke="#292b30"/><text x="33" y="238" class="m" font-size="11" fill="#f2f1ec" letter-spacing=".5">Laravel</text><rect x="94.97" y="222" width="85" height="24" fill="none" stroke="#292b30"/><text x="103.97" y="238" class="m" font-size="11" fill="#f2f1ec" letter-spacing=".5">Inertia.js</text><rect x="186.07" y="222" width="99" height="24" fill="none" stroke="#292b30"/><text x="195.07" y="238" class="m" font-size="11" fill="#f2f1ec" letter-spacing=".5">Tailwind CSS</text></g>
<line x1="24" y1="262" x2="456" y2="262" stroke="#292b30" stroke-dasharray="2 4"/>
<circle cx="30" cy="280" r="3.5" class="a"/><circle cx="30" cy="280" r="3.5" class="a pulse"/><text x="42" y="284" class="m t" font-size="11" letter-spacing="1.5">PUBLIC</text>
<path d="M6,14V6H14 M466,6H474V14 M474,286V294H466 M14,294H6V286" fill="none" stroke="#a8a8a2" stroke-width="1"/>
