<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="76" viewBox="0 0 1000 76" role="img" aria-label="Full-stack / Platform / Data / Production">
<title>Full-stack / Platform / Data / Production</title>
<style>
.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace}.s{font-family:Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif}
.t{fill:#101010}.mu{fill:#595959}.v{fill:#8155ff}.a{fill:#5f7f00}.ol{fill:#101010}
.fb{transform-box:fill-box;transform-origin:center}
.r{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.f{animation:fade 1.2s ease both}
.blink{animation:blink 1.05s steps(1) infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.flow{stroke-dasharray:3 7;animation:flow .9s linear infinite}
.draw{stroke-dasharray:1;animation:draw 1.6s cubic-bezier(.16,1,.3,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.6s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.mq1{animation:mq1 16s linear infinite}@keyframes mq1{to{transform:translateX(-560px)}}
.mq2{animation:mq2 20s linear infinite}@keyframes mq2{from{transform:translateX(-560px)}to{transform:none}}

</style>
<rect width="1000" height="76" fill="#f4f3ef"/>
<rect y="0" width="1000" height="40" fill="#faf9f6"/>
<rect y="40" width="1000" height="36" fill="#d7ff3f"/>
<line x1="0" y1="0.5" x2="1000" y2="0.5" stroke="#d4d2cc"/>
<line x1="0" y1="40" x2="1000" y2="40" stroke="#d4d2cc"/>
<g class="mq1"><text x="0" y="30" class="m t" font-size="14" font-weight="600" letter-spacing="2" textLength="526" lengthAdjust="spacing">FULL-STACK / PLATFORM / DATA / PRODUCTION ✣</text><text x="560" y="30" class="m t" font-size="14" font-weight="600" letter-spacing="2" textLength="526" lengthAdjust="spacing">FULL-STACK / PLATFORM / DATA / PRODUCTION ✣</text><text x="1120" y="30" class="m t" font-size="14" font-weight="600" letter-spacing="2" textLength="526" lengthAdjust="spacing">FULL-STACK / PLATFORM / DATA / PRODUCTION ✣</text><text x="1680" y="30" class="m t" font-size="14" font-weight="600" letter-spacing="2" textLength="526" lengthAdjust="spacing">FULL-STACK / PLATFORM / DATA / PRODUCTION ✣</text></g>
<g class="mq2"><text x="0" y="63" class="m ol" font-size="14" font-weight="600" letter-spacing="2" textLength="526" lengthAdjust="spacing">DESIGN THE INTERFACE / OPERATE THE SYSTEM ✣</text><text x="560" y="63" class="m ol" font-size="14" font-weight="600" letter-spacing="2" textLength="526" lengthAdjust="spacing">DESIGN THE INTERFACE / OPERATE THE SYSTEM ✣</text><text x="1120" y="63" class="m ol" font-size="14" font-weight="600" letter-spacing="2" textLength="526" lengthAdjust="spacing">DESIGN THE INTERFACE / OPERATE THE SYSTEM ✣</text><text x="1680" y="63" class="m ol" font-size="14" font-weight="600" letter-spacing="2" textLength="526" lengthAdjust="spacing">DESIGN THE INTERFACE / OPERATE THE SYSTEM ✣</text></g>
</svg>
