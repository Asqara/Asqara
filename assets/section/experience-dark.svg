<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="112" viewBox="0 0 1000 112" role="img" aria-label="/ 10 EXPERIENCE — Operating in context.">
<title>/ 10 EXPERIENCE — Operating in context.</title>
<style>
.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace}.s{font-family:Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif}
.t{fill:#f2f1ec}.mu{fill:#a8a8a2}.v{fill:#9875ff}.a{fill:#d7ff3f}.ol{fill:#101010}
.fb{transform-box:fill-box;transform-origin:center}
.r{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.f{animation:fade 1.2s ease both}
.blink{animation:blink 1.05s steps(1) infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.flow{stroke-dasharray:3 7;animation:flow .9s linear infinite}
.draw{stroke-dasharray:1;animation:draw 1.6s cubic-bezier(.16,1,.3,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.6s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.run{animation:run 4.5s cubic-bezier(.65,0,.35,1) infinite}
@keyframes run{0%{transform:translateX(0)}50%{transform:translateX(976px)}100%{transform:translateX(0)}}

</style>
<rect width="1000" height="112" fill="#0c0d0f"/>
<line x1="0" y1="10" x2="1000" y2="10" stroke="#292b30"/>
<line x1="0" y1="10" x2="1000" y2="10" stroke="#9875ff" stroke-width="2" pathLength="1" class="draw"/>
<rect class="run" x="0" y="7" width="24" height="6" fill="#d7ff3f"/>
<text x="24" y="44" class="m v r" font-size="13" letter-spacing="1.5">/ 10  <tspan class="mu">EXPERIENCE</tspan></text>
<g class="r" style="animation-delay:0.15s"><text x="22" y="94" class="s t" font-size="40" font-weight="800" letter-spacing="-1.4">OPERATING IN CONTEXT.</text></g>
<text x="948" y="44" text-anchor="end" class="m mu f" font-size="11" letter-spacing="1.5" style="animation-delay:0.30s">SCN_10</text>
<g class="spin" fill="#d7ff3f" style="animation-delay:0.00s"><rect x="964.4" y="31.0" width="3.2" height="18.0" rx="1.6" transform="rotate(0 966 40)"/><rect x="964.4" y="31.0" width="3.2" height="18.0" rx="1.6" transform="rotate(45 966 40)"/><rect x="964.4" y="31.0" width="3.2" height="18.0" rx="1.6" transform="rotate(90 966 40)"/><rect x="964.4" y="31.0" width="3.2" height="18.0" rx="1.6" transform="rotate(135 966 40)"/></g>
</svg>
