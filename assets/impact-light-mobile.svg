<svg xmlns="http://www.w3.org/2000/svg" width="640" height="564" viewBox="0 0 640 564" role="img" aria-labelledby="title"><title id="title">Work in numbers: approximately 8,000 student records prepared and normalized; approximately 1,000 requests per second at peak on production infrastructure; more than 600 million rupiah in cumulative store transaction value.</title><rect width="640" height="564" fill="#F0F2E9"/>
