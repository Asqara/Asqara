<text x="32" y="140" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#536A5C">Prepared &amp; normalized</text>
<path d="M400 28V148" stroke="#B2C0AE"/>
<text x="432" y="70" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.5" fill="#294F3B">~1,000 RPS</text>
<text x="432" y="109" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#182B23">Production infrastructure</text>
<text x="432" y="140" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#536A5C">Approximate peak load</text>
<path d="M800 28V148" stroke="#B2C0AE"/>
<text x="832" y="70" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.5" fill="#294F3B">Rp600M+</text>
<text x="832" y="109" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#182B23">Store transactions</text>
<text x="832" y="140" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#536A5C">Cumulative value handled</text>
