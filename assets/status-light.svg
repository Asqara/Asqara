<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="System status">
<title>System status</title>
<style>
.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace}.s{font-family:Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif}
.t{fill:#101010}.mu{fill:#595959}.v{fill:#8155ff}.a{fill:#5f7f00}.ol{fill:#101010}
.fb{transform-box:fill-box;transform-origin:center}
.r{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.f{animation:fade 1.2s ease both}
.blink{animation:blink 1.05s steps(1) infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.flow{stroke-dasharray:3 7;animation:flow .9s linear infinite}
.draw{stroke-dasharray:1;animation:draw 1.6s cubic-bezier(.16,1,.3,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.6s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.hand{transform-box:view-box;animation:spin 6s linear infinite}

</style>
<rect width="1000" height="200" fill="#f4f3ef"/>
<rect x=".5" y=".5" width="999" height="199" fill="#faf9f6" stroke="#d4d2cc"/>
<line x1="0" y1="100" x2="1000" y2="100" stroke="#d4d2cc"/>
<g class="r" style="animation-delay:0.00s"><text x="22" y="36" class="m mu" font-size="11" letter-spacing="2">CURRENT FOCUS</text><text x="22" y="70" class="s t" font-size="19" font-weight="700">Platform Engineering</text></g>
<line x1="250" y1="0" x2="250" y2="100" stroke="#d4d2cc"/>
<g class="r" style="animation-delay:0.07s"><text x="272" y="36" class="m mu" font-size="11" letter-spacing="2">LOCATION</text><text x="272" y="70" class="s t" font-size="19" font-weight="700">Bogor, Indonesia</text></g>
<line x1="500" y1="0" x2="500" y2="100" stroke="#d4d2cc"/>
<g class="r" style="animation-delay:0.14s"><text x="522" y="36" class="m mu" font-size="11" letter-spacing="2">TIMEZONE</text><text x="522" y="70" class="s t" font-size="19" font-weight="700">UTC+7</text></g>
<circle cx="718" cy="32" r="12" fill="none" stroke="#595959" stroke-width="1.5"/><line x1="718" y1="32" x2="718" y2="23" stroke="#5f7f00" stroke-width="2" class="hand" style="transform-origin:718px 32px"/><circle cx="718" cy="32" r="2" class="a"/>
<line x1="750" y1="0" x2="750" y2="100" stroke="#d4d2cc"/>
<g class="r" style="animation-delay:0.21s"><text x="772" y="36" class="m mu" font-size="11" letter-spacing="2">AVAILABILITY</text><text x="772" y="70" class="s t" font-size="19" font-weight="700">Open to opportunities</text></g>
<circle cx="974" cy="32" r="4.5" class="a"/><circle cx="974" cy="32" r="4.5" class="a pulse" style="animation-delay:0.90s"/>
<g class="r" style="animation-delay:0.28s"><text x="22" y="136" class="m mu" font-size="11" letter-spacing="2">GITHUB</text><text x="22" y="170" class="s t" font-size="19" font-weight="700">@Asqara</text></g>
<line x1="250" y1="100" x2="250" y2="200" stroke="#d4d2cc"/>
<g class="r" style="animation-delay:0.35s"><text x="272" y="136" class="m mu" font-size="11" letter-spacing="2">ACTIVITY_STREAM</text><text x="272" y="170" class="s t" font-size="19" font-weight="700">ACTIVE</text></g>
<rect class="eq" x="438" y="118" width="5" height="22" fill="#8155ff" style="animation-delay:0.00s"/>
<rect class="eq" x="446" y="118" width="5" height="22" fill="#8155ff" style="animation-delay:0.13s"/>
<rect class="eq" x="454" y="118" width="5" height="22" fill="#8155ff" style="animation-delay:0.26s"/>
<rect class="eq" x="462" y="118" width="5" height="22" fill="#8155ff" style="animation-delay:0.39s"/>
<rect class="eq" x="470" y="118" width="5" height="22" fill="#8155ff" style="animation-delay:0.52s"/>
<line x1="500" y1="100" x2="500" y2="200" stroke="#d4d2cc"/>
<g class="r" style="animation-delay:0.42s"><text x="522" y="136" class="m mu" font-size="11" letter-spacing="2">GPA</text><text x="522" y="170" class="s t" font-size="19" font-weight="700">3.80 / 4.00</text></g>
<line x1="750" y1="100" x2="750" y2="200" stroke="#d4d2cc"/>
<g class="r" style="animation-delay:0.49s"><text x="772" y="136" class="m mu" font-size="11" letter-spacing="2">PROFILE</text><text x="772" y="170" class="s t" font-size="19" font-weight="700">OPERATIONAL</text></g>
<circle cx="974" cy="132" r="4.5" class="a"/><circle cx="974" cy="132" r="4.5" class="a pulse" style="animation-delay:2.10s"/>
</svg>
